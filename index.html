<!doctype html><html><head><meta charset="utf-8"><title>Loading dashboard...</title></head><body>
<div id="ld" style="font-family:sans-serif;padding:40px;text-align:center;color:#555">Loading dashboard&hellip;</div>
<script>
(async function(){
  var v = "20260922a"; // cache-busting version string -- bump this on every single deploy
  var parts = ["part_000.txt", "part_001.txt", "part_002.txt", "part_003.txt"];
  try {
    var texts = await Promise.all(parts.map(function(p){
      return fetch(p + "?v=" + v, {cache: "no-store"}).then(function(r){
        if(!r.ok) throw new Error('Failed to fetch '+p+': '+r.status);
        return r.text();
      });
    }));
    var full = texts.join('');
    document.open();
    document.write(full);
    document.close();
  } catch(e) {
    document.getElementById('ld').textContent = 'Failed to load dashboard: ' + e.message;
  }
})();
</script>
</body></html>
